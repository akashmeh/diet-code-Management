<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Code Ticket</title>
    <style>
        /* Client-specific Styles for Email */
        #outlook a {
            padding: 0;
        }

        body {
            width: 100% !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .ExternalClass {
            width: 100%;
        }

        .ExternalClass,
        .ExternalClass p,
        .ExternalClass span,
        .ExternalClass font,
        .ExternalClass td,
        .ExternalClass div {
            line-height: 100%;
        }

        table td {
            border-collapse: collapse;
        }

        a {
            color: #000000;
            text-decoration: none;
        }
    </style>
</head>

<body
    style="margin: 0; padding: 40px 20px; background-color: #1a1a1a; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">

    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center">

                <table border="0" cellpadding="0" cellspacing="0" width="100%"
                    style="max-width: 400px; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.5);">
                    <!-- Unified Ticket Body with Background Image -->
                    <tr>
                        <td background="https://i.ibb.co/Jwkxkk1X/mailbk.png"
                            style="background-color: #800020; background-image: url('https://i.ibb.co/Jwkxkk1X/mailbk.png'); background-size: cover; color: #ffffff;">

                            <!-- Content Wrapper -->
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="padding: 40px 40px 35px 40px;">
                                        <!-- Logo -->
                                        <div style="text-align: center; margin-bottom: 35px;">
                                            <img src="https://i.ibb.co/LXxsNk1T/diet-code-logo.png" alt="Diet Code Logo"
                                                style="display: block; margin: 0 auto; max-width: 240px; height: auto; border: 0;">
                                        </div>

                                        <div style="font-size: 18px; margin-bottom: 10px; color: #ffffff;">
                                            Team:
                                        </div>
                                        <div
                                            style="font-size: 32px; font-weight: bold; color: #ffffff; margin: 0 0 40px 0; line-height: 1.1; text-transform: uppercase; font-family: 'Arial Black', Impact, sans-serif;">
                                            Spam chandra
                                        </div>

                                        <div
                                            style="font-size: 18px; margin-bottom: 40px; color: #ffffff; line-height: 1.4;">
                                            September 26, 2026<br>
                                            9:00 AM<br>
                                            Srm Ramapuram, MLCP Lab - 6
                                        </div>

                                        <table border="0" cellpadding="0" cellspacing="0" width="100%"
                                            style="border-top: 1px solid rgba(255,255,255,0.4); padding-top: 20px;">
                                            <tr>
                                                <td>
                                                    <span
                                                        style="display: block; font-size: 14px; color: rgba(255,255,255,0.9); margin-bottom: 4px;">Team
                                                        ID</span>
                                                    <span
                                                        style="display: block; font-size: 22px; font-weight: bold; color: #FFFF00; font-family: monospace;">DC001

                                                    </span>
                                                </td>
                                                <td align="right" valign="bottom">

                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- QR Section -->
                    <tr>
                        <td style="background-color: #ffffff; padding: 30px 40px; text-align: center;">
                            <p
                                style="margin: 0 0 20px 0; font-size: 13px; font-weight: bold; color: #000000; text-align: left; text-transform: uppercase; letter-spacing: 1px;">
                                </p>
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=015684625&color=000000&bgcolor=ffffff"
                                alt="QR Code" width="200" height="200"
                                style="display: block; margin: 0 auto; border: 0; width: 100%; max-width: 200px; height: auto;">
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>

</html>
